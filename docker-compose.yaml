services:
  postgres:
    image: postgres:18
    container_name: hatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hatch
      POSTGRES_PASSWORD: hatch
      POSTGRES_DB: hatch
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<version>/.
      - postgres18_data:/var/lib/postgresql
    networks:
      - hatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:

networks:
  hatch:
    driver: bridge
