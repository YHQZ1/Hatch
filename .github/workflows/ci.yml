name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hatch
          POSTGRES_PASSWORD: hatch
          POSTGRES_DB: hatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.30.0"

      - name: Check generated database code is current
        working-directory: internal/store
        run: sqlc diff

      - name: Lint
        run: make lint-go

      # The template the user runs in their own AWS account: a mistake here is
      # found when someone connects, not when the code is built.
      - name: Lint the CloudFormation template
        run: pipx run --spec cfn-lint==1.58.0 cfn-lint deploy/cloudformation/hatch-connect.yaml

      # Tests that need Postgres create and drop their own databases here.
      - name: Test
        run: make test
        env:
          HATCH_TEST_DATABASE_URL: postgres://hatch:hatch@localhost:5432/postgres?sslmode=disable

      # Runs twice: the second run must find nothing to do.
      - name: Apply all migrations to Postgres 18 with hatch migrate
        run: |
          go run ./cmd/hatch migrate
          go run ./cmd/hatch migrate
        env:
          DATABASE_URL: postgres://hatch:hatch@localhost:5432/hatch?sslmode=disable

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the hatch image
        run: docker build --build-arg VERSION="${GITHUB_SHA::12}" -t hatch:ci .

      - name: Check the image runs
        run: docker run --rm hatch:ci version

      # Without the UI the binary still builds and runs, but answers 503.
      - name: Check the web UI is embedded in the binary
        run: docker run --rm --entrypoint grep hatch:ci -qa '<div id="root"' /usr/local/bin/hatch

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the build leaves the working tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
