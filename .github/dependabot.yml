# Weekly dependency update PRs, grouped so minor and patch bumps arrive
# together. Update the gomod directories when Phase 1 merges the modules.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /apps/api
      - /apps/builder
      - /apps/deployer
      - /packages/*
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/*
    schedule:
      interval: weekly
