# Weekly dependency update PRs, grouped so minor and patch bumps arrive
# together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node runtime, which stays on the 24 LTS line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API that typescript-eslint and
      # next build use; revisit when they support it.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 24 LTS until the next LTS line is chosen deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
